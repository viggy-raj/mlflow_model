<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLflow Model Registry</title>
    <meta name="description" content="Register your trained PyTorch and ONNX models directly into the MLflow Model Registry.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ── Design tokens ───────────────────────────────────────────────── */
        :root {
            --bg-base:        #0b0f1a;
            --bg-card:        rgba(255, 255, 255, 0.04);
            --bg-card-hover:  rgba(255, 255, 255, 0.07);
            --border:         rgba(255, 255, 255, 0.09);
            --border-focus:   rgba(99, 179, 237, 0.6);
            --border-drop:    rgba(99, 179, 237, 0.8);
            --accent-blue:    #63b3ed;
            --accent-purple:  #9f7aea;
            --accent-green:   #68d391;
            --accent-red:     #fc8181;
            --text-primary:   #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted:     #64748b;
            --radius-lg:      16px;
            --radius-md:      10px;
            --radius-sm:      6px;
            --shadow-glow:    0 0 40px rgba(99, 179, 237, 0.08);
            --transition:     all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ── Reset & base ────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            /* Subtle dot-grid background */
            background-image:
                radial-gradient(circle at 20% 20%, rgba(99,179,237,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(159,122,234,0.06) 0%, transparent 50%),
                radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 28px 28px;
        }

        /* ── Page header ─────────────────────────────────────────────────── */
        .page-header {
            text-align: center;
            margin-bottom: 36px;
            animation: fadeDown 0.5s ease both;
        }

        .page-header .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 179, 237, 0.1);
            border: 1px solid rgba(99, 179, 237, 0.25);
            border-radius: 100px;
            padding: 4px 14px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-blue);
            margin-bottom: 16px;
        }

        .page-header .badge-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-blue);
            animation: pulse 2s infinite;
        }

        .page-header h1 {
            font-size: clamp(26px, 5vw, 38px);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-blue) 60%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .page-header p {
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* ── Card ────────────────────────────────────────────────────────── */
        .card {
            width: 100%;
            max-width: 680px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 36px;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-glow), 0 4px 24px rgba(0,0,0,0.4);
            animation: fadeUp 0.5s ease 0.1s both;
        }

        .models-card {
            max-width: 900px;
            margin-top: 24px;
        }

        /* ── Form elements ───────────────────────────────────────────────── */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 13px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input[type="text"]::placeholder, input[type="number"]::placeholder, textarea::placeholder { color: var(--text-muted); }

        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            border-color: var(--border-focus);
            background: rgba(99, 179, 237, 0.04);
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.12);
        }

        select option {
            background-color: var(--bg-base);
            color: var(--text-primary);
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            text-transform: none;
            letter-spacing: normal;
            color: var(--text-primary);
            cursor: pointer;
            margin-bottom: 0;
            gap: 8px;
        }

        .checkbox-label input {
            cursor: pointer;
        }

        /* ── Drag-and-drop upload zone ───────────────────────────────────── */
        .drop-zone {
            position: relative;
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255,255,255,0.02);
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--border-drop);
            background: rgba(99, 179, 237, 0.05);
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.1);
        }

        .drop-zone.has-file {
            border-style: solid;
            border-color: rgba(104, 211, 145, 0.5);
            background: rgba(104, 211, 145, 0.04);
        }

        /* Hidden real file input, overlaid on drop zone */
        #modelFileInput {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .drop-zone-icon {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
            transition: var(--transition);
        }

        .drop-zone:hover .drop-zone-icon { transform: scale(1.1); }

        .drop-zone-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .drop-zone-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        .file-selected {
            display: none;
            align-items: center;
            gap: 10px;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--accent-green);
        }

        .file-selected .file-icon { font-size: 22px; }

        .drop-zone.has-file .drop-zone-content { display: none; }
        .drop-zone.has-file .file-selected { display: flex; }

        /* ── Submit button ───────────────────────────────────────────────── */
        .btn-submit {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #4299e1 0%, #667eea 100%);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.01em;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn-submit:hover:not(:disabled)::before { opacity: 1; }
        .btn-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(66,153,225,0.35); }
        .btn-submit:active:not(:disabled) { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-danger {
            background: transparent;
            color: var(--accent-red);
            border: 1px solid rgba(252, 129, 129, 0.4);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-danger:hover {
            background: rgba(252, 129, 129, 0.1);
            border-color: var(--accent-red);
        }

        /* ── Spinner ─────────────────────────────────────────────────────── */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        /* ── Result panels ───────────────────────────────────────────────── */
        #resultPanel { margin-top: 28px; animation: fadeUp 0.4s ease both; }
        #resultPanel.hidden { display: none; }

        .result-card {
            border-radius: var(--radius-md);
            padding: 24px;
            border: 1px solid;
        }

        .result-card.success {
            background: rgba(104, 211, 145, 0.06);
            border-color: rgba(104, 211, 145, 0.3);
        }

        .result-card.error {
            background: rgba(252, 129, 129, 0.06);
            border-color: rgba(252, 129, 129, 0.3);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .result-icon { font-size: 22px; }

        .result-title {
            font-size: 16px;
            font-weight: 600;
        }

        .result-card.success .result-title { color: var(--accent-green); }
        .result-card.error .result-title { color: var(--accent-red); }

        /* Info grid for success details */
        .info-grid {
            display: grid;
            gap: 12px;
        }

        .info-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .info-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .info-value {
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            word-break: break-all;
            background: rgba(255,255,255,0.04);
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .info-value.highlight {
            color: var(--accent-green);
            border-color: rgba(104,211,145,0.2);
            background: rgba(104,211,145,0.05);
        }

        .error-msg {
            font-size: 14px;
            color: var(--accent-red);
            line-height: 1.6;
        }

        /* ── Divider ─────────────────────────────────────────────────────── */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        /* ── View Models button ──────────────────────────────────────────── */
        .btn-secondary {
            width: 100%;
            padding: 12px 24px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }
        .btn-secondary:hover:not(:disabled) {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(99, 179, 237, 0.05);
        }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary .btn-spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(148,163,184,0.3);
            border-top-color: var(--text-secondary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        /* ── Models list panel ───────────────────────────────────────────── */
        .models-panel {
            margin-top: 24px;
            animation: fadeUp 0.4s ease both;
        }
        .models-panel.hidden { display: none; }
        .models-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .models-panel-title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .models-count {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 100px;
            background: rgba(99,179,237,0.1);
            border: 1px solid rgba(99,179,237,0.2);
            color: var(--accent-blue);
            font-weight: 600;
        }
        .models-table-wrap {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }
        .models-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .models-table th {
            text-align: left;
            padding: 10px 14px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--text-muted);
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
        }
        .models-table td {
            padding: 11px 14px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 12px;
            word-break: break-word;
            vertical-align: middle;
        }
        .models-table tr:last-child td { border-bottom: none; }
        .models-table tr:hover td { background: rgba(255,255,255,0.02); }
        .version-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 100px;
            background: rgba(104,211,145,0.1);
            border: 1px solid rgba(104,211,145,0.25);
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 600;
        }
        .empty-state {
            padding: 28px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            font-family: inherit;
        }

        /* ── Animations ──────────────────────────────────────────────────── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>

<body>

    <!-- ── Page header ────────────────────────────────────────────────── -->
    <header class="page-header">
        <div class="badge">
            <span class="badge-dot"></span>
            MLflow Model Registry
        </div>
        <h1>Register a Model</h1>
        <p>Upload a trained <code>.pt</code> or <code>.onnx</code> model to log and register it via MLflow.</p>
    </header>

    <!-- ── Registration card ──────────────────────────────────────────── -->
    <main class="card">
        <form id="registerForm" novalidate>

            <div class="grid-2">
                <!-- Model Name -->
                <div class="field">
                    <label for="modelNameInput">Model Name</label>
                    <input id="modelNameInput" type="text" name="model_name" placeholder="e.g. resnet_v1" autocomplete="off" required>
                </div>
                
                <!-- Model Type -->
                <div class="field">
                    <label for="model_type">Model Type</label>
                    <select id="model_type" name="model_type" required>
                        <option value="">Select...</option>
                        <option value="Speech">Speech</option>
                        <option value="NER">NER</option>
                        <option value="File Classifier">File Classifier</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <!-- Architecture -->
                <div class="field">
                    <label for="architecture">Architecture</label>
                    <select id="architecture" name="architecture" required>
                        <option value="">Select...</option>
                        <option value="__ADD_NEW__">+ Add New Architecture</option>
                    </select>
                    <input type="text" id="new_architecture" name="new_architecture" placeholder="Enter new architecture" style="display:none; margin-top:10px;">
                </div>
                
                <!-- Versioning -->
                <div class="field">
                    <label for="versioning">Versioning</label>
                    <select id="versioning" name="versioning">
                        <option value="Auto-increment">Auto-increment</option>
                        <option value="Major">Major</option>
                        <option value="Minor">Minor</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <!-- Accuracy -->
                <div class="field">
                    <label for="accuracy">Accuracy (0-100)</label>
                    <input id="accuracy" type="number" step="0.1" min="0" max="100" name="accuracy" placeholder="e.g. 95.5" required>
                </div>
                
                <!-- Priority -->
                <div class="field">
                    <label for="priority">Priority</label>
                    <input id="priority" type="number" name="priority" placeholder="e.g. 1" required>
                </div>
            </div>

            <!-- Deployment Points -->
            <div class="field" id="deployment_points_container" style="display:none;">
                <label>Deployment Points</label>
                <div id="deployment_points_list" style="display:flex; flex-wrap:wrap; gap:15px; margin-top:8px;">
                </div>
            </div>

            <div class="field">
                <label class="checkbox-label">
                    <input type="checkbox" id="is_deployable" name="is_deployable" value="true">
                    Is Deployable?
                </label>
            </div>

            <!-- Remarks -->
            <div class="field">
                <label for="remarks">Remarks</label>
                <textarea id="remarks" name="remarks" placeholder="Add any notes here..."></textarea>
            </div>

            <!-- File Upload -->
            <div class="field">
                <label>Model File <span style="color:var(--text-muted);text-transform:none;font-weight:400;">(.pt or .onnx)</span></label>

                <div class="drop-zone" id="dropZone">
                    <!-- Invisible real file input layered on top -->
                    <input id="modelFileInput" type="file" name="model" accept=".pt,.onnx" required aria-label="Upload .pt or .onnx model file">

                    <!-- Default state (no file) -->
                    <div class="drop-zone-content">
                        <span class="drop-zone-icon">📦</span>
                        <div class="drop-zone-title">Drag & drop your model here</div>
                        <div class="drop-zone-sub">or click to browse — .pt or .onnx files only</div>
                    </div>

                    <!-- File selected state -->
                    <div class="file-selected">
                        <span class="file-icon">✅</span>
                        <span id="selectedFileName">model.pt</span>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Submit -->
            <button class="btn-submit" id="submitBtn" type="submit">
                <span class="btn-inner">
                    <span class="spinner" id="spinner"></span>
                    <span id="btnText">Register Model</span>
                </span>
            </button>

        </form>

        <!-- ── Result panel (shown after submit) ─────────────────────── -->
        <div id="resultPanel" class="hidden"></div>

        <!-- ── View Registered Models button ─────────────────────────── -->
        <button class="btn-secondary" id="listModelsBtn" type="button">
            <span class="btn-spinner" id="listSpinner"></span>
            <span id="listBtnText">🗂 View Registered Models</span>
        </button>
    </main>

    <!-- ── Models list panel ──────────────────────────────────────── -->
    <div class="card models-card hidden" id="modelsPanel">
        <div class="models-panel-header">
            <span class="models-panel-title">Registered Models</span>
            <span class="models-count" id="modelsCount">0</span>
        </div>
        <div class="models-table-wrap">
            <table class="models-table">
                <thead>
                    <tr>
                        <th>Model</th>
                        <th>Details</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="modelsTableBody"></tbody>
            </table>
        </div>
    </div>


    <script>
        const form         = document.getElementById('registerForm');
        const dropZone     = document.getElementById('dropZone');
        const fileInput    = document.getElementById('modelFileInput');
        const selectedName = document.getElementById('selectedFileName');
        const submitBtn    = document.getElementById('submitBtn');
        const spinner      = document.getElementById('spinner');
        const btnText      = document.getElementById('btnText');
        const resultPanel  = document.getElementById('resultPanel');

        // Initial setup calls
        fetchArchitectures();

        // ── Form dynamic interactions ──────────────────────────────────────

        document.getElementById('architecture').addEventListener('change', (e) => {
            const newArchInput = document.getElementById('new_architecture');
            if (e.target.value === '__ADD_NEW__') {
                newArchInput.style.display = 'block';
                newArchInput.required = true;
            } else {
                newArchInput.style.display = 'none';
                newArchInput.required = false;
            }
        });

        const COMPATIBILITY_RULES = {
            'Speech': ['Cloud App', 'Edge Device'],
            'NER': ['Cloud App'],
            'File Classifier': ['Dashboard', 'Cloud App']
        };

        const modelTypeSelect = document.getElementById('model_type');
        const dpContainer = document.getElementById('deployment_points_container');
        const dpList = document.getElementById('deployment_points_list');

        modelTypeSelect.addEventListener('change', () => {
            const selected = modelTypeSelect.value;
            dpList.innerHTML = '';
            if (selected && COMPATIBILITY_RULES[selected]) {
                dpContainer.style.display = 'block';
                COMPATIBILITY_RULES[selected].forEach(dp => {
                    dpList.innerHTML += `<label class="checkbox-label"><input type="checkbox" name="deployment_points" value="${dp}"> ${dp}</label>`;
                });
            } else {
                dpContainer.style.display = 'none';
            }
        });

        function fetchArchitectures() {
            fetch('/api/architectures/')
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.architectures) {
                        const archSelect = document.getElementById('architecture');
                        archSelect.innerHTML = `
                            <option value="">Select...</option>
                            <option value="__ADD_NEW__">+ Add New Architecture</option>
                        `;
                        data.architectures.forEach(arch => {
                            if (arch) {
                                const opt = document.createElement('option');
                                opt.value = arch;
                                opt.textContent = arch;
                                archSelect.appendChild(opt);
                            }
                        });
                    }
                });
        }

        // ── Drag-and-drop visual feedback ─────────────────────────────────

        ['dragenter', 'dragover'].forEach(evt =>
            dropZone.addEventListener(evt, e => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            })
        );

        ['dragleave', 'drop'].forEach(evt =>
            dropZone.addEventListener(evt, e => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
            })
        );

        dropZone.addEventListener('drop', e => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const dt = new DataTransfer();
                dt.items.add(files[0]);
                fileInput.files = dt.files;
                showFileSelected(files[0].name);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                showFileSelected(fileInput.files[0].name);
            }
        });

        function showFileSelected(name) {
            selectedName.textContent = name;
            dropZone.classList.add('has-file');
        }

        // ── Form submission ────────────────────────────────────────────────

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const modelName = document.getElementById('modelNameInput').value.trim();

            if (!modelName) {
                showError('Please enter a model name.');
                return;
            }
            if (!fileInput.files || fileInput.files.length === 0) {
                showError('Please select a model file to upload.');
                return;
            }

            setLoading(true);
            resultPanel.classList.add('hidden');

            const formData = new FormData(form);
            
            // Fix architecture logic
            let archValue = document.getElementById('architecture').value;
            if (archValue === '__ADD_NEW__') {
                archValue = document.getElementById('new_architecture').value;
            }
            formData.set('architecture', archValue);

            try {
                const response = await fetch('/api/models/register/', {
                    method: 'POST',
                    body: formData,
                });

                const data = await safeJson(response);

                if (data.success) {
                    showSuccess(data);
                    form.reset();
                    dropZone.classList.remove('has-file');
                    fetchArchitectures();
                    if (!modelsPanel.classList.contains('hidden')) {
                        loadModels(); // Refresh list if open
                    }
                } else {
                    showError(data.error || 'An unknown error occurred.');
                }

            } catch (err) {
                showError(`Network error: ${err.message}`);
            } finally {
                setLoading(false);
            }
        });

        // ── UI helpers ─────────────────────────────────────────────────────

        function setLoading(loading) {
            submitBtn.disabled = loading;
            spinner.style.display = loading ? 'block' : 'none';
            btnText.textContent = loading ? 'Registering…' : 'Register Model';
        }

        function showSuccess(data) {
            resultPanel.innerHTML = `
                <div class="result-card success">
                    <div class="result-header">
                        <span class="result-icon">🎉</span>
                        <span class="result-title">Model Registered Successfully</span>
                    </div>
                    <div class="info-grid">
                        <div class="info-row">
                            <span class="info-label">Model Name</span>
                            <span class="info-value highlight">${escHtml(data.model_name)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Version</span>
                            <span class="info-value highlight">v${escHtml(String(data.version))}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Run ID</span>
                            <span class="info-value" style="font-family:'JetBrains Mono'">${escHtml(data.run_id)}</span>
                        </div>
                    </div>
                </div>
            `;
            resultPanel.classList.remove('hidden');
        }

        function showError(message) {
            resultPanel.innerHTML = `
                <div class="result-card error">
                    <div class="result-header">
                        <span class="result-icon">⚠️</span>
                        <span class="result-title">Registration Failed</span>
                    </div>
                    <p class="error-msg">${escHtml(message)}</p>
                </div>
            `;
            resultPanel.classList.remove('hidden');
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function safeJson(response) {
            const ct = response.headers.get('content-type') || '';
            if (!ct.includes('application/json')) {
                const text = await response.text();
                throw new Error(`Server returned HTTP ${response.status}. Expected JSON but got: ${text.substring(0, 120)}...`);
            }
            return response.json();
        }

        // ── View & Delete Models ──────────────────────────────────────────

        const listModelsBtn  = document.getElementById('listModelsBtn');
        const listSpinner    = document.getElementById('listSpinner');
        const listBtnText    = document.getElementById('listBtnText');
        const modelsPanel    = document.getElementById('modelsPanel');
        const modelsCount    = document.getElementById('modelsCount');
        const modelsTableBody = document.getElementById('modelsTableBody');

        async function loadModels() {
            setListLoading(true);
            try {
                const response = await fetch('/api/models/');
                const data = await safeJson(response);

                if (!data.success) {
                    showError(data.error || 'Could not fetch models.');
                    modelsPanel.classList.add('hidden');
                    return;
                }

                renderModelsTable(data.models);
            } catch (err) {
                showError(`Network error: ${err.message}`);
                modelsPanel.classList.add('hidden');
            } finally {
                setListLoading(false);
            }
        }

        listModelsBtn.addEventListener('click', loadModels);

        function setListLoading(loading) {
            listModelsBtn.disabled = loading;
            listSpinner.style.display = loading ? 'block' : 'none';
            listBtnText.textContent = loading ? 'Fetching…' : '🗂 View Registered Models';
        }

        function renderModelsTable(models) {
            modelsCount.textContent = models.length;
            modelsTableBody.innerHTML = '';

            if (models.length === 0) {
                modelsTableBody.innerHTML = `
                    <tr><td colspan="3" class="empty-state">No models registered yet.</td></tr>
                `;
                modelsPanel.classList.remove('hidden');
                return;
            }

            for (const model of models) {
                const versions = model.all_versions;

                const groupRow = document.createElement('tr');
                groupRow.innerHTML = `
                    <td colspan="3" style="
                        background: rgba(99,179,237,0.06);
                        border-bottom: 1px solid rgba(99,179,237,0.15);
                        border-top: 1px solid rgba(99,179,237,0.15);
                        padding: 8px 14px;
                        font-family: inherit;
                        font-size: 14px;
                        font-weight: 600;
                        color: var(--accent-blue);
                    ">📦 ${escHtml(model.name)}</td>
                `;
                modelsTableBody.appendChild(groupRow);

                if (versions.length === 0) {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>—</td><td>—</td><td>—</td>`;
                    modelsTableBody.appendChild(row);
                } else {
                    for (const v of versions) {
                        const isLatest = v.version === versions[0].version;
                        const createdDate = v.creation_timestamp ? new Date(v.creation_timestamp).toLocaleString() : '—';
                        
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td style="white-space: nowrap; vertical-align: top;">
                                <div style="margin-bottom:6px;">
                                    <span class="version-badge">v${escHtml(String(v.version))}</span>
                                    ${isLatest ? '<span style="margin-left:6px;font-size:10px;color:var(--accent-green);font-family:inherit;font-weight:600;">LATEST</span>' : ''}
                                </div>
                                <div style="font-size:11px; color:var(--text-muted); font-family:inherit;">
                                    Size: ${escHtml(v.formatted_size)}
                                </div>
                            </td>
                            <td>
                                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px;">
                                    <div><strong style="color:var(--text-secondary);">Type:</strong> ${escHtml(v.model_type)}</div>
                                    <div><strong style="color:var(--text-secondary);">Arch:</strong> ${escHtml(v.architecture || '-')}</div>
                                    <div><strong style="color:var(--text-secondary);">Acc:</strong> ${escHtml(v.accuracy)}</div>
                                    <div><strong style="color:var(--text-secondary);">Format:</strong> ${escHtml(v.framework)}</div>
                                </div>
                                <div style="font-size:11px; color:var(--text-muted);">
                                    Deployable: ${v.is_deployable ? 'Yes' : 'No'} <br>
                                    Points: ${(v.deployment_points && v.deployment_points.length > 0) ? escHtml(v.deployment_points.join(', ')) : '-'}
                                </div>
                            </td>
                            <td style="vertical-align: middle; text-align: right;">
                                <button class="btn-danger" onclick="deleteModelVersion('${escHtml(model.name)}', ${v.version}, ${v.db_id})">Delete</button>
                            </td>
                        `;
                        modelsTableBody.appendChild(row);
                    }
                }
            }

            modelsPanel.classList.remove('hidden');
        }

        async function deleteModelVersion(name, version, db_id) {
            if (!confirm(`Are you sure you want to delete ${name} v${version}?`)) return;
            
            try {
                const res = await fetch(`/api/models/${name}/version/${version}/`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ db_id: db_id })
                });
                const data = await safeJson(res);
                if (data.success) {
                    alert('Success: ' + data.message);
                    loadModels();
                } else {
                    alert('Failed to delete: ' + data.error);
                }
            } catch (err) {
                alert('Deletion failed: ' + err);
            }
        }
    </script>
</body>
</html>
